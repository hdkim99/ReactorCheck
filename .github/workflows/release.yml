name: Release package

on:
  release:
    types: [published]

jobs:
  build:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Clean wheel install
        run: |
          python -m venv /tmp/reactorcheck-release-venv
          /tmp/reactorcheck-release-venv/bin/python -m pip install dist/*.whl
          /tmp/reactorcheck-release-venv/bin/python -m pip check
      - name: Installed import, CLI, and example smoke
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          /tmp/reactorcheck-release-venv/bin/python -c "import os, reactorcheck; expected=os.environ['RELEASE_TAG'].removeprefix('v'); assert reactorcheck.__version__ == expected, (reactorcheck.__version__, expected)"
          /tmp/reactorcheck-release-venv/bin/reactorcheck --help
          /tmp/reactorcheck-release-venv/bin/reactorcheck analyze \
            examples/synthetic_composition.csv \
            --config examples/synthetic_composition_config.json \
            --output /tmp/reactorcheck-release-example.xlsx
      - name: Installed GUI wiring smoke
        run: |
          xvfb-run -a /tmp/reactorcheck-release-venv/bin/python \
            tests/gui_widget_smoke.py \
            examples/synthetic_composition.csv \
            examples/synthetic_composition_config.json \
            /tmp/reactorcheck-release-gui.xlsx
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/reactorcheck
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
