name: Real dataset compatibility
description: Report a laboratory export or public dataset that ReactorCheck cannot process as documented.
title: "compatibility: "
body:
  - type: markdown
    attributes:
      value: |
        Do not upload confidential, unpublished, proprietary, sensitive, or licensed raw files to this public issue. A sanitized header/schema or minimal synthetic reproducer is usually enough.
  - type: input
    id: version
    attributes:
      label: Project version
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: input
    id: os_install
    attributes:
      label: Operating system and installation method
    validations:
      required: true
  - type: input
    id: instrument
    attributes:
      label: Instrument / vendor
      description: Omit serial numbers and institutional identifiers.
    validations:
      required: true
  - type: input
    id: file_type
    attributes:
      label: Input file type
      placeholder: "CSV or XLSX; include worksheet layout when relevant"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and sanitized error message
    validations:
      required: true
  - type: dropdown
    id: shareable
    attributes:
      label: Can the data be shared publicly under clear redistribution terms?
      options: [Yes, No, Unsure]
    validations:
      required: true
  - type: input
    id: public_source
    attributes:
      label: Public dataset DOI / URL, if applicable
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer or sanitized header/schema
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data safety
      options:
        - label: I have not uploaded confidential data, personal information, credentials, proprietary files, or internal paths.
          required: true
