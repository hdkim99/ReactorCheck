name: Bug report
description: Report reproducible incorrect software behavior.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not upload unpublished, confidential, proprietary, licensed, identifying, or sensitive research data. Never include credentials, tokens, or internal paths. Prefer a minimal synthetic reproducer.
  - type: input
    id: version
    attributes:
      label: ReactorCheck version
      placeholder: "reactorcheck --version"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: input
    id: installation
    attributes:
      label: Installation method
      placeholder: "PyPI, editable source install, or other"
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [CLI, GUI, Python API]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Sanitized error message
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: Use synthetic or clearly redistributable data only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data safety
      options:
        - label: I have not included private research data, credentials, internal paths, or identifying metadata.
          required: true
