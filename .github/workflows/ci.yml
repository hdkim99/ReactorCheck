name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: CLI smoke
        run: >-
          reactorcheck analyze examples/synthetic_reactor.csv
          --config examples/synthetic_config.json
          --output /tmp/reactorcheck.xlsx
          --plot /tmp/reactorcheck.png

  package-and-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: reactorcheck --version
      - name: Installed-package analysis smoke
        working-directory: /tmp
        run: >-
          reactorcheck analyze "$GITHUB_WORKSPACE/examples/synthetic_reactor.csv"
          --config "$GITHUB_WORKSPACE/examples/synthetic_config.json"
          --output /tmp/installed.xlsx
      - name: GUI widget/backend wiring smoke
        run: >-
          xvfb-run -a python tests/gui_widget_smoke.py
          examples/synthetic_reactor.csv
          examples/synthetic_config.json
          /tmp/gui-wired.xlsx
