name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reactorcheck-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required:
    name: CI / required
    # Only owner-authored same-repository PRs may execute on persistent research hardware.
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 60
    env:
      PIP_NO_CACHE_DIR: "1"
      REACTORCHECK_CI_VENV: reactorcheck-ci-${{ github.run_id }}-${{ github.run_attempt }}
      REACTORCHECK_WHEEL_VENV: reactorcheck-wheel-${{ github.run_id }}-${{ github.run_attempt }}
      REACTORCHECK_CI_OUTPUT: reactorcheck-output-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Configure shared Tk and Xvfb runtime
        env:
          REACTORCHECK_GUI_RUNTIME: /opt/catalysttwin-actions/shared-gui-runtime
        run: |
          set -eu
          runtime="$REACTORCHECK_GUI_RUNTIME"
          bin_dir="$runtime/usr/bin"
          lib_dir="$runtime/usr/lib/aarch64-linux-gnu"
          tk_dir="$runtime/usr/share/tcltk/tk8.6"
          test -d "$bin_dir"
          test -d "$lib_dir"
          test -d "$tk_dir"
          export PATH="$bin_dir:$PATH"
          export LD_LIBRARY_PATH="$lib_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export TK_LIBRARY="$tk_dir"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
          {
            printf 'LD_LIBRARY_PATH=%s\n' "$LD_LIBRARY_PATH"
            printf 'TK_LIBRARY=%s\n' "$TK_LIBRARY"
          } >> "$GITHUB_ENV"
          command -v Xvfb
          command -v xvfb-run
          python -c 'import tkinter; print(tkinter.TkVersion)'
      - name: Create isolated environments
        run: |
          python -m venv "$RUNNER_TEMP/$REACTORCHECK_CI_VENV"
          python -m venv "$RUNNER_TEMP/$REACTORCHECK_WHEEL_VENV"
          mkdir -p "$RUNNER_TEMP/$REACTORCHECK_CI_OUTPUT"
      - name: Install project in the isolated environment
        run: |
          "$RUNNER_TEMP/$REACTORCHECK_CI_VENV/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/$REACTORCHECK_CI_VENV/bin/python" -m pip install -e ".[dev]"
          "$RUNNER_TEMP/$REACTORCHECK_CI_VENV/bin/python" -m pip check
      - name: Check formatting
        run: >-
          "$RUNNER_TEMP/$REACTORCHECK_CI_VENV/bin/python" -m ruff format --check .
      - name: Lint
        run: >-
          "$RUNNER_TEMP/$REACTORCHECK_CI_VENV/bin/python" -m ruff check .
      - name: Type check
        run: >-
          "$RUNNER_TEMP/$REACTORCHECK_CI_VENV/bin/python" -m mypy src
      - name: Unit, integration, and scientific tests
        run: >-
          "$RUNNER_TEMP/$REACTORCHECK_CI_VENV/bin/python" -m pytest
      - name: Build and validate distributions
        run: |
          "$RUNNER_TEMP/$REACTORCHECK_CI_VENV/bin/python" -m build
          "$RUNNER_TEMP/$REACTORCHECK_CI_VENV/bin/python" -m twine check dist/*
      - name: Verify clean wheel on ARM64
        run: |
          "$RUNNER_TEMP/$REACTORCHECK_WHEEL_VENV/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/$REACTORCHECK_WHEEL_VENV/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/$REACTORCHECK_WHEEL_VENV/bin/python" -m pip check
          "$RUNNER_TEMP/$REACTORCHECK_WHEEL_VENV/bin/python" - <<'PY'
          import importlib.metadata
          import platform
          import reactorcheck

          machine = platform.machine().lower()
          assert machine in {"aarch64", "arm64"}, machine
          assert reactorcheck.__version__ == importlib.metadata.version("reactorcheck")
          print(machine, reactorcheck.__version__, reactorcheck.__file__)
          PY
      - name: Exercise installed CLI and example workflow
        run: |
          "$RUNNER_TEMP/$REACTORCHECK_WHEEL_VENV/bin/reactorcheck" --help
          "$RUNNER_TEMP/$REACTORCHECK_WHEEL_VENV/bin/reactorcheck" --version
          "$RUNNER_TEMP/$REACTORCHECK_WHEEL_VENV/bin/reactorcheck" analyze \
            examples/synthetic_composition.csv \
            --config examples/synthetic_composition_config.json \
            --output "$RUNNER_TEMP/$REACTORCHECK_CI_OUTPUT/installed.xlsx" \
            --plot "$RUNNER_TEMP/$REACTORCHECK_CI_OUTPUT/installed.png"
          test -s "$RUNNER_TEMP/$REACTORCHECK_CI_OUTPUT/installed.xlsx"
          test -s "$RUNNER_TEMP/$REACTORCHECK_CI_OUTPUT/installed.png"
      - name: Exercise installed GUI wiring
        run: |
          xvfb-run -a "$RUNNER_TEMP/$REACTORCHECK_WHEEL_VENV/bin/python" \
            tests/gui_widget_smoke.py \
            examples/synthetic_composition.csv \
            examples/synthetic_composition_config.json \
            "$RUNNER_TEMP/$REACTORCHECK_CI_OUTPUT/gui-wired.xlsx"
          test -s "$RUNNER_TEMP/$REACTORCHECK_CI_OUTPUT/gui-wired.xlsx"
      - name: Remove isolated environments and generated files
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil

          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for variable in (
              "REACTORCHECK_CI_VENV",
              "REACTORCHECK_WHEEL_VENV",
              "REACTORCHECK_CI_OUTPUT",
          ):
              target = (runner_temp / os.environ[variable]).resolve()
              if runner_temp not in target.parents:
                  raise RuntimeError(f"Refusing to clean outside runner temp: {target}")
              shutil.rmtree(target, ignore_errors=True)
          for relative in (
              "build",
              "dist",
              ".mypy_cache",
              ".pytest_cache",
              ".ruff_cache",
              ".coverage",
              "htmlcov",
          ):
              target = (workspace / relative).resolve()
              if workspace not in target.parents:
                  raise RuntimeError(f"Refusing to clean outside workspace: {target}")
              if target.is_dir():
                  shutil.rmtree(target)
              elif target.exists():
                  target.unlink()
          for target in workspace.rglob("__pycache__"):
              if workspace in target.resolve().parents:
                  shutil.rmtree(target)
          PY
          test -z "$(git status --porcelain)"
