[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reactorcheck"
version = "0.2.2"
description = "Unit-aware catalytic reactor analysis from compositions or measured species flows."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Hyun Dong Kim"}]
keywords = [
  "catalysis",
  "reactor",
  "chemical-engineering",
  "mole-fraction",
  "internal-standard",
  "scientific-software",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Typing :: Typed",
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pint>=0.23",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pandas-stubs>=2.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-openpyxl>=3.1",
  "twine>=5.1",
]

[project.scripts]
reactorcheck = "reactorcheck.cli:main"
reactorcheck-gui = "reactorcheck.gui:main"

[project.urls]
Homepage = "https://github.com/hdkim99/ReactorCheck"
Repository = "https://github.com/hdkim99/ReactorCheck"
Issues = "https://github.com/hdkim99/ReactorCheck/issues"
Documentation = "https://github.com/hdkim99/ReactorCheck#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/reactorcheck"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "scientific: hand-calculated or synthetic scientific regression test",
  "integration: cross-layer integration test",
  "gui: GUI/controller smoke test",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["reactorcheck"]
exclude = ["tests"]
